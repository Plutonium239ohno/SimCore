[package]
name = "sim-core"
description = "Shared physics core for ParticleSim and NuclearSim: 2D particle solver, walls, nuclear physics, renderer and panel GUI."
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Keep debug builds usable: optimize dependencies, lightly optimize our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
